<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#12121A}</style></head><body><canvas id="c"></canvas>
<script type="module">
import { wolfHead, accessory } from './wolves.js';
const cv = document.getElementById('c'), c = cv.getContext('2d'), W = 800, H = 260, dpr = 2;
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; c.scale(dpr, dpr);
const COL = ['#2ECC71', '#E74C3C', '#3498DB', '#F1C40F'];
for (let i = 0; i < 4; i++) { const x = 100 + i * 200; c.beginPath(); c.roundRect(x - 88, 30, 176, 200, 28); c.fillStyle = COL[i]; c.fill(); c.save(); c.translate(x, 140); wolfHead(c, 70, i === 1 ? 0.8 : 0); accessory(c, i, 70, 0.3); c.restore(); }
</script></body></html>
