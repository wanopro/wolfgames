<!doctype html><meta charset=utf-8><body style="margin:0;background:#12121A"><canvas id=c width=786 height=1520 style="width:393px;height:760px"></canvas>
<script type=module>
import { CoinToss, coin } from './coin.js';
const cv = document.getElementById('c'), x = cv.getContext('2d'); x.scale(2, 2); const W = 393, H = 760; let G;
window.setup = (k) => {
  if (k === 'normal') G = new CoinToss(4, [[0.6, 0, 1], [1.0, 2, -1], [1.3, 1, 1], [1.9, 3, -1]], 1);
  if (k === 'edge') G = new CoinToss(6, [[0.5, 0, -1], [0.8, 3, 1], [1.0, 1, 1], [1.3, 5, -1], [1.6, 2, 1], [1.9, 4, -1]], 0);
  if (k === 'faces') G = { draw: (c) => { c.fillStyle = '#12121A'; c.fillRect(0, 0, W, H); coin(c, W / 2, 200, 110, 1); coin(c, W / 2, 520, 110, -1); } };
};
window.frame = (t) => { x.fillStyle = '#12121A'; x.fillRect(0, 0, W, H); G.draw(x, W, H, t); };
</script>
