name: APK 빌드

on:
  push:
    paths-ignore: ['web/**', 'README.md', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK 만들기
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: 빌드 오류 기록 (build-log 브랜치)
        if: failure()
        run: |
          mkdir -p /tmp/r && grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -300 > /tmp/r/errors.txt || true
          cd /tmp/r && git init -q && git checkout -q -b build-log && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm "build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-log

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk WolfGames.apk

      # 에뮬레이터에서 실제로 켜 보고, 켜지자마자 꺼지면 릴리스하지 않음
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 실행 점검
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r WolfGames.apk
            adb logcat -c
            adb shell monkey -p com.wolfgames.app -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d -b crash
            adb shell pidof com.wolfgames.app

      - uses: actions/upload-artifact@v4
        with:
          name: WolfGames-apk
          path: WolfGames.apk

      # 커밋 메시지에 [release] 가 있으면 build.gradle 의 versionName 으로 정식 릴리스(v1.0 등)
      - name: 릴리스 이름 정하기
        id: rel
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; echo "name=울프 게임즈 ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "$MSG" == *"[release]"* ]]; then
            echo "tag=v${VER}" >> "$GITHUB_OUTPUT"; echo "name=울프 게임즈 v${VER}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"; echo "name=울프 게임즈 빌드 ${{ github.run_number }} (v${VER})" >> "$GITHUB_OUTPUT"
          fi

      # 같은 버전으로 다시 릴리스하면 태그를 이 커밋으로 옮겨 최신 내용으로 교체
      - name: 버전 태그를 이 커밋으로 이동
        if: startsWith(steps.rel.outputs.tag, 'v')
        run: |
          git tag -f "${{ steps.rel.outputs.tag }}"
          git push -f origin "refs/tags/${{ steps.rel.outputs.tag }}"

      - name: 릴리스에 APK 올리기 (폰에서 바로 다운로드용)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ startsWith(steps.rel.outputs.tag, 'v') }}
          overwrite_files: true
          body_path: ${{ startsWith(steps.rel.outputs.tag, 'v') && 'RELEASE_NOTES.md' || '' }}
          files: WolfGames.apk
