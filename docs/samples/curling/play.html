<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>늑대컬링 — 늑대 맥주잔 시안</title>
<style>html,body{margin:0;background:#12121A;font-family:-apple-system,"Noto Sans KR",sans-serif}canvas{display:block;margin:0 auto}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import { wolfMug } from './wolfmug.js';
const cv = document.getElementById('c'), c = cv.getContext('2d'), W = 390, H = 780, dpr = +(new URLSearchParams(location.search).get('dpr') || 2);
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; c.scale(dpr, dpr);
const ease = (u) => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), 2);
const T = (s, x, y, size, col, w = 900, al = 'center') => { c.font = `${w} ${size}px -apple-system,"Noto Sans KR",sans-serif`; c.textAlign = al; c.textBaseline = 'middle'; c.fillStyle = col; c.fillText(s, x, y); };
const EDGE = 120, X0 = 55, X1 = 335, START = 590, PX_CM = 6;
const P = [{ col: '#FF5A6E', n: '1' }, { col: '#4FC3F7', n: '2' }, { col: '#FFD54F', n: '3' }];
const size = (y) => 74 * (0.7 + 0.3 * Math.min(1, Math.max(0, (y - EDGE) / (START - EDGE))));
const cm = (y) => Math.round((y - EDGE) / PX_CM);
function table(t) {
  c.fillStyle = '#15151D'; c.fillRect(0, 0, W, H);
  // 바닥 (테이블 밖)
  c.fillStyle = '#1E1E28'; c.fillRect(0, 44, W, EDGE - 44);
  for (let i = 0; i < 8; i++) { c.fillStyle = 'rgba(255,255,255,.03)'; c.fillRect(i * 52 - ((t * 0) % 52), 44, 26, EDGE - 44); }
  // 테이블 (나무 판자)
  c.beginPath(); c.roundRect(X0, EDGE, X1 - X0, H - EDGE + 20, [6, 6, 0, 0]); c.fillStyle = '#8D5A34'; c.fill();
  for (let i = 1; i < 5; i++) { const x = X0 + (X1 - X0) * i / 5; c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(x - 1, EDGE, 2, H); }
  for (let k = 0; k < 14; k++) { c.fillStyle = 'rgba(255,255,255,.05)'; c.fillRect(X0 + 10 + (k * 53) % (X1 - X0 - 30), EDGE + 30 + k * 47, 30, 2); }
  // 끝자리 점수 띠
  const zg = c.createLinearGradient(0, EDGE, 0, EDGE + 110); zg.addColorStop(0, 'rgba(255,215,64,.55)'); zg.addColorStop(1, 'rgba(255,215,64,0)');
  c.fillStyle = zg; c.fillRect(X0, EDGE, X1 - X0, 110);
  c.fillStyle = '#C08A5B'; c.fillRect(X0, EDGE - 3, X1 - X0, 6); // 테이블 끝
  T('🔥', X0 + 16, EDGE + 16, 16, '#fff'); T('🔥', X1 - 16, EDGE + 16, 16, '#fff');
  // 옆 자 (cm)
  for (let y = EDGE; y < START; y += PX_CM * 10) { c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(X1 + 4, y, 10, 2); T(String(cm(y)), X1 + 30, y + 1, 11, 'rgba(255,255,255,.5)', 700); }
  // 출발선
  c.setLineDash([8, 8]); c.beginPath(); c.moveTo(X0, START); c.lineTo(X1, START); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2; c.stroke(); c.setLineDash([]);
}
function hud(cur) {
  T('←  늑대컬링', 70, 22, 18, '#fff', 700);
  P.forEach((p, i) => { const x = W - 100 + i * 32; c.beginPath(); c.arc(x, 22, i === cur ? 13 : 10, 0, 7); c.fillStyle = p.col; c.globalAlpha = i === cur ? 1 : 0.45; c.fill(); c.globalAlpha = 1; T(p.n, x, 23, 12, '#000'); });
}
function stopped(p, y, label = true) {
  wolfMug(c, W / 2 + (p.n === '1' ? -60 : p.n === '2' ? 40 : 0), y, size(y), p.col, p.n, 0);
  if (label) T(`${cm(y)}cm`, W / 2 + (p.n === '1' ? -60 : 40), y + 16, 13, '#fff', 800);
}
// 뒤로 당겼다가 놓기 (새총처럼): 당긴 길이 = 힘
function pull(u, x, p, maxPull) {
  const k = ease(Math.min(1, u / 0.75)), d = k * maxPull, my = START + 40 + d;
  const strong = d / 90;
  // 고무줄 기둥 + 줄
  for (const sx of [-1, 1]) { c.beginPath(); c.arc(x + sx * 58, START + 4, 7, 0, 7); c.fillStyle = '#5D4037'; c.fill(); }
  c.beginPath(); c.moveTo(x - 58, START + 4); c.lineTo(x - 26, my - 6); c.moveTo(x + 58, START + 4); c.lineTo(x + 26, my - 6);
  c.strokeStyle = '#FF7043'; c.lineWidth = 4; c.lineCap = 'round'; c.stroke();
  wolfMug(c, x, my, size(START), p.col, p.n, Math.sin(u * 30) * 0.3 * k);
  // 날아갈 방향 화살표 (당길수록 길게)
  c.setLineDash([6, 8]); c.beginPath(); c.moveTo(x, START - 60); c.lineTo(x, START - 60 - d * 2.6); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 3; c.stroke(); c.setLineDash([]);
  c.beginPath(); c.moveTo(x - 10, START - 50 - d * 2.6); c.lineTo(x, START - 66 - d * 2.6); c.lineTo(x + 10, START - 50 - d * 2.6); c.strokeStyle = 'rgba(255,255,255,.7)'; c.stroke();
  // 손가락 (잔을 잡고 아래로)
  T('👆', x + 6, my + 30, 38, '#fff');
  // 힘 막대
  const bx = 22, by = START + 60, bh = 150;
  c.beginPath(); c.roundRect(bx - 8, by - bh, 16, bh, 8); c.fillStyle = 'rgba(255,255,255,.15)'; c.fill();
  c.beginPath(); c.roundRect(bx - 8, by - bh * strong, 16, bh * strong, 8); c.fillStyle = strong > 0.85 ? '#FF3D5A' : strong > 0.5 ? '#FFB300' : '#69F0AE'; c.fill();
  T('💪', bx, by + 18, 18, '#fff');
}
window.frame = (t) => {
  t %= 9.8;
  table(t);
  const Y1 = 238, Y2 = 168;
  if (t < 3.6) { // 2번 차례: 딱 좋은 곳에 멈춤
    hud(1); stopped(P[0], Y1);
    const x = W / 2 + 40;
    if (t < 1.2) pull(t / 1.2, x, P[1], 55);
    else {
      const u = Math.min(1, (t - 1.2) / 1.7), y0 = START + 40 + 55, y = y0 - ease(u) * (y0 - Y2);
      for (let k = 1; k < 5 && u < 1; k++) { c.globalAlpha = 0.12; wolfMug(c, x, y + k * 14 * (1 - u), size(y), P[1].col, '', 0); } c.globalAlpha = 1;
      wolfMug(c, x, y, size(y), P[1].col, '2', Math.sin(t * 22) * (1 - u));
      if (u >= 1) { T(`${cm(Y2)}cm`, x, Y2 + 16, 13, '#fff', 800); const v = Math.min(1, (t - 2.9) / 0.3); c.globalAlpha = v; T('🥇', x - 36, Y2 + 15, 18, '#fff'); c.globalAlpha = 1; }
    }
    return;
  }
  // 3번 차례: 너무 세게! → 떨어짐
  hud(2); stopped(P[0], Y1); stopped(P[1], Y2); T('🥇', W / 2 + 4, Y2 + 15, 18, '#fff');
  const x = W / 2, t3 = t - 3.6;
  if (t3 < 1.0) { pull(t3 / 1.0, x, P[2], 90); return; }
  const u = Math.min(1, (t3 - 1.0) / 1.0), yEnd = EDGE - 14, y0 = START + 130, y = y0 - ease(u) * (y0 - yEnd);
  if (u < 1) {
    for (let k = 1; k < 5; k++) { c.globalAlpha = 0.12; wolfMug(c, x, y + k * 20, size(y), P[2].col, '', 0); } c.globalAlpha = 1;
    wolfMug(c, x, y, size(y), P[2].col, '3', Math.sin(t * 22)); return;
  }
  const f = t3 - 2.0; // 넘어져서 떨어짐
  const s = size(EDGE) * Math.max(0.15, 1 - f * 0.9), rot = Math.min(1.9, f * 4);
  // 쏟아진 맥주
  if (f > 0.15) { const p = Math.min(1, (f - 0.15) / 0.5); c.beginPath(); c.ellipse(x - 10, EDGE - 40, 70 * p, 18 * p, 0, 0, 7); c.fillStyle = 'rgba(255,179,0,.75)'; c.fill(); c.beginPath(); c.ellipse(x - 30, EDGE - 46, 40 * p, 8 * p, 0, 0, 7); c.fillStyle = 'rgba(255,253,245,.8)'; c.fill(); }
  if (f < 1.1) { c.save(); c.globalAlpha = Math.max(0, 1 - f / 1.1); c.translate(x, yEnd + f * 30); c.rotate(-rot); wolfMug(c, 0, 0, s, P[2].col, '3', 1); c.restore(); }
  for (let k = 0; k < 8 && f < 1.2; k++) { const a = -Math.PI / 2 - 1.2 + k * 0.35, d = f * 90; c.globalAlpha = Math.max(0, 1 - f); T('💦', x + Math.cos(a) * d, EDGE - 30 + Math.sin(a) * d, 16, '#fff'); } c.globalAlpha = 1;
  if (f > 0.7) {
    const v = Math.min(1, (f - 0.7) / 0.4); c.globalAlpha = v;
    c.beginPath(); c.roundRect(24, 500, W - 48, 190, 22); c.fillStyle = 'rgba(10,10,16,.88)'; c.fill();
    T('💦 떨어졌다!', W / 2, 536, 26, '#4FC3F7');
    const rows = [[P[1], `🥇 ${cm(Y2)}cm`], [P[0], `${cm(Y1)}cm`], [P[2], '💦']];
    rows.forEach(([p, s2], i) => { const rx = 70 + i * 100; c.beginPath(); c.arc(rx, 590, 16, 0, 7); c.fillStyle = p.col; c.fill(); T(p.n, rx, 591, 15, '#000'); T(s2, rx, 624, 15, '#fff', 800); });
    T('3 → 💀 원샷!', W / 2, 664, 22, '#FF5A6E');
    c.globalAlpha = 1;
  }
};
let t0 = performance.now(); const loop = () => { frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
if (!location.search.includes('still')) loop();
</script></body></html>
