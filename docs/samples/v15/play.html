<!doctype html><meta charset=utf-8><body style="margin:0;background:#12121A"><canvas id=c width=786 height=1520 style="width:393px;height:760px"></canvas>
<script type=module>
import { Tug, Slap, Kings, Beer } from './games.js';
const cv = document.getElementById('c'), x = cv.getContext('2d'); x.scale(2, 2);
const W = 393, H = 760; let G;
function tugTaps() { const a = []; let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  // P1(아래) 초반 우세 → P2 역전 → P1 막판 역전승
  for (let t = 1.0; t < 11; t += 0.02) { const p1 = t < 3 ? 0.62 : t < 5.5 ? 0.32 : 0.72; if (r() < 0.42) a.push([t, r() < p1 ? 0 : 1]); }
  return a.map(([t, p]) => [t, p, 40 + r() * (W - 80), p === 0 ? H - 60 - r() * 200 : 60 + r() * 200]); }
window.setup = (k) => {
  if (k === 'tug') G = new Tug(tugTaps());
  if (k === 'slap') G = new Slap([
    { t: 0, kind: 'ready', att: 0, score: [0, 0] }, { t: 1.4, kind: 'feint', att: 0, score: [0, 0] }, { t: 2.0, kind: 'ready', att: 0, score: [0, 0] },
    { t: 2.8, kind: 'slap', att: 0, score: [1, 0] }, { t: 4.6, kind: 'ready', att: 0, score: [1, 0] },
    { t: 5.4, kind: 'dodge', att: 0, score: [1, 0] }, { t: 7.0, kind: 'ready', att: 1, score: [1, 0] },
    { t: 8.0, kind: 'flinch', att: 1, score: [1, 1] }, { t: 9.6, kind: 'ready', att: 1, score: [1, 1] }]);
  if (k === 'kings') G = new Kings([[0.8, '5', '♥'], [2.6, 'K', '♠'], [4.4, 'A', '♦'], [6.2, '4', '♣'], [8.0, 'K', '♥'], [9.8, 'K', '♦'], [11.6, 'K', '♣']]);
  if (k === 'beer') G = new Beer(3, [[4.55, 1], [4.78, 0]]);
};
window.frame = (t) => { x.fillStyle = '#12121A'; x.fillRect(0, 0, W, H); G.draw(x, W, H, t); };
</script>
