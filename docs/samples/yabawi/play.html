<!doctype html><html><head><meta charset="utf-8"><title>늑대 야바위 — 시안</title>
<style>html,body{margin:0;background:#12121A;font-family:-apple-system,"Noto Sans KR",sans-serif}canvas{display:block;margin:0 auto}</style></head><body><canvas id="c"></canvas>
<script type="module">
import { coin } from '../../../web/art.js';
const cv = document.getElementById('c'), c = cv.getContext('2d'), W = 390, H = 780, dpr = +(new URLSearchParams(location.search).get('dpr') || 2);
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; c.scale(dpr, dpr);
const ease = (u) => { u = Math.min(1, Math.max(0, u)); return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; };
const T = (s, x, y, size, col, w = 900) => { c.font = `${w} ${size}px -apple-system,"Noto Sans KR",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = col; c.fillText(s, x, y); };
// 🐺 야바위 늑대 (앞모습). open: 입 0~1, mood: 0 보통 · 1 통과(웃음) · -1 꽝(땀)
function yWolf(x, y, r, open, mood = 0, t = 0) {
  c.save(); c.translate(x, y);
  c.beginPath(); c.ellipse(0, r * 1.02, r * 0.85, r * 0.16, 0, 0, 7); c.fillStyle = 'rgba(0,0,0,.35)'; c.fill();
  for (const s of [-1, 1]) {
    c.beginPath(); c.moveTo(s * r * 0.28, -r * 0.62); c.lineTo(s * r * 0.78, -r * 1.25); c.lineTo(s * r * 0.92, -r * 0.3); c.closePath(); c.fillStyle = '#7C8593'; c.fill();
    c.beginPath(); c.moveTo(s * r * 0.44, -r * 0.6); c.lineTo(s * r * 0.74, -r * 1.02); c.lineTo(s * r * 0.82, -r * 0.42); c.closePath(); c.fillStyle = '#F6AFC0'; c.fill();
  }
  c.beginPath(); c.ellipse(0, 0, r, r * 0.92, 0, 0, 7); c.fillStyle = '#9AA3AF'; c.fill();
  for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * r * 0.92, r * 0.05); c.lineTo(s * r * 1.15, r * 0.25); c.lineTo(s * r * 0.9, r * 0.42); c.closePath(); c.fillStyle = '#9AA3AF'; c.fill(); }
  // 눈
  for (const s of [-1, 1]) {
    if (mood === 1) { c.beginPath(); c.arc(s * r * 0.36, -r * 0.2, r * 0.13, Math.PI * 1.1, Math.PI * 1.9); c.strokeStyle = '#2B2B33'; c.lineWidth = r * 0.07; c.lineCap = 'round'; c.stroke(); }
    else { c.beginPath(); c.ellipse(s * r * 0.36, -r * 0.2, r * 0.13, r * 0.15, 0, 0, 7); c.fillStyle = '#2B2B33'; c.fill(); c.beginPath(); c.arc(s * r * 0.32, -r * 0.26, r * 0.05, 0, 7); c.fillStyle = '#fff'; c.fill(); }
    c.beginPath(); c.ellipse(s * r * 0.62, r * 0.16, r * 0.13, r * 0.08, 0, 0, 7); c.fillStyle = 'rgba(255,130,150,.55)'; c.fill();
  }
  // 주둥이 + 입
  c.beginPath(); c.ellipse(0, r * 0.38, r * 0.5, r * 0.36 + open * r * 0.22, 0, 0, 7); c.fillStyle = '#F1EEE8'; c.fill();
  c.beginPath(); c.ellipse(0, r * 0.16, r * 0.13, r * 0.09, 0, 0, 7); c.fillStyle = '#2B2B33'; c.fill();
  if (open > 0.04) {
    c.beginPath(); c.ellipse(0, r * 0.5 + open * r * 0.12, r * 0.32, r * 0.05 + open * r * 0.3, 0, 0, 7); c.fillStyle = '#5A1E2B'; c.fill();
    c.fillStyle = '#fff'; for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * r * 0.24, r * 0.5 - open * r * 0.16); c.lineTo(s * r * 0.14, r * 0.5 - open * r * 0.16); c.lineTo(s * r * 0.19, r * 0.5 - open * r * 0.04); c.closePath(); c.fill(); }
    c.beginPath(); c.ellipse(0, r * 0.62 + open * r * 0.2, r * 0.14, r * 0.07, 0, 0, 7); c.fillStyle = '#F48FB1'; c.fill();
  } else {
    c.beginPath(); c.moveTo(-r * 0.16, r * 0.36); c.quadraticCurveTo(-r * 0.08, r * 0.46, 0, r * 0.36); c.quadraticCurveTo(r * 0.08, r * 0.46, r * 0.16, r * 0.36); c.strokeStyle = '#2B2B33'; c.lineWidth = r * 0.05; c.lineCap = 'round'; c.stroke();
  }
  if (mood === -1) { c.beginPath(); c.ellipse(r * 0.78, -r * 0.55 + Math.sin(t * 6) * 2, r * 0.09, r * 0.14, 0.3, 0, 7); c.fillStyle = '#4FC3F7'; c.fill(); }
  c.restore();
}
// --- 장면 ---
const N = 4, EMPTY = 2, R = 36, Y = 400;
const slotX = (k) => W / 2 + (k - (N - 1) / 2) * 93;
// 섞기 순서 (고정): [a, b, 걸리는 시간]
const SW = []; { let s = 7, d = 0.62; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647); while (d > 0.1) { let a = Math.floor(rnd() * N), b = Math.floor(rnd() * (N - 1)); if (b >= a) b++; SW.push([a, b, d]); d *= 0.88; } for (let k = 0; k < 6; k++) { let a = Math.floor(rnd() * N), b = Math.floor(rnd() * (N - 1)); if (b >= a) b++; SW.push([a, b, 0.1]); } }
const SH0 = 3.0, SHT = SW.reduce((a, s) => a + s[2], 0), SH1 = SH0 + SHT;
function slots(t) { // 늑대 k → (x, y)
  const pos = [...Array(N).keys()]; let tt = SH0;
  for (const [a, b, d] of SW) {
    if (t < tt) break;
    const wa = pos.indexOf(a), wb = pos.indexOf(b);
    if (t < tt + d) { const u = ease((t - tt) / d), out = pos.map((sl) => ({ x: slotX(sl), y: Y })); out[wa] = { x: slotX(a) + (slotX(b) - slotX(a)) * u, y: Y - Math.sin(u * Math.PI) * 46 }; out[wb] = { x: slotX(b) + (slotX(a) - slotX(b)) * u, y: Y + Math.sin(u * Math.PI) * 46 }; return { out, fast: d < 0.2 }; }
    pos[wa] = b; pos[wb] = a; tt += d;
  }
  return { out: pos.map((sl) => ({ x: slotX(sl), y: Y })), fast: false, pos };
}
const PICK1 = 0, PICK2 = EMPTY; // 1번 사람은 코인 늑대, 2번 사람은 빈 늑대를 고름
window.frame = (t) => {
  const L = SH1 + 5.2; t %= L;
  c.fillStyle = '#12121A'; c.fillRect(0, 0, W, H);
  T('←  늑대 야바위', 76, 26, 18, '#fff', 700);
  // 테이블
  c.beginPath(); c.ellipse(W / 2, Y + 60, 190, 60, 0, 0, 7); c.fillStyle = '#2E7D32'; c.fill(); c.beginPath(); c.ellipse(W / 2, Y + 56, 176, 52, 0, 0, 7); c.fillStyle = '#388E3C'; c.fill();
  const { out, fast } = slots(t);
  let msg = '', msgC = '#fff';
  // 1) 입 벌리기 · 코인 먹기
  const eatAt = (k) => 0.7 + [0, 1, 3].indexOf(k) * 0.55; // 코인 먹는 늑대 0 · 1 · 3 (2번 늑대는 못 먹음)
  for (let k = 0; k < N; k++) {
    let open = 0, mood = 0;
    const p = out[k];
    if (t < SH0) {
      open = Math.min(1, t / 0.5);
      if (k !== EMPTY && t > eatAt(k) + 0.45) open = Math.max(0, 1 - (t - eatAt(k) - 0.45) / 0.2);
      if (t > 2.4) open = Math.max(0, open - (t - 2.4) / 0.3);
    }
    // 4) 고르기 → 입 벌리기
    const P1 = SH1 + 1.3, P2 = SH1 + 3.0;
    if (t > P1 && k === PICK1) { open = Math.min(1, (t - P1) / 0.25); mood = 1; }
    if (t > P2 && k === PICK2) { open = Math.min(1, (t - P2) / 0.25); mood = -1; }
    if (fast && t >= SH0 && t < SH1) { c.globalAlpha = 0.25; yWolf(p.x + (Math.random() - 0.5) * 14, p.y, R, 0); c.globalAlpha = 1; }
    const bob = t > SH1 ? Math.sin(t * 5 + k) * 3 : 0;
    yWolf(p.x, p.y + bob, R, open, mood, t);
    // 입 안 코인
    if (t > P1 && k === PICK1) coin(c, p.x, p.y + R * 0.55 - Math.min(1, (t - P1) / 0.4) * 30, 16, 1);
    if (t > P1 && k === PICK1 && t > P1 + 0.3) T('✅', p.x, p.y - R * 1.75, 28, '#fff');
    if (t > P2 && k === PICK2 && t > P2 + 0.3) T('💀', p.x, p.y - R * 1.75, 28, '#fff');
  }
  // 날아가는 코인
  for (const k of [0, 1, 3]) {
    const u = (t - eatAt(k)) / 0.45; if (u < 0 || u > 1 || t > SH0) continue;
    const x0 = W / 2, y0 = 150, x1 = slotX(k), y1 = Y + R * 0.5;
    coin(c, x0 + (x1 - x0) * u, y0 + (y1 - y0) * u - Math.sin(u * Math.PI) * 80, 18 - 6 * u, 1, 1 - Math.abs(Math.sin(u * 9)) * 0.7);
  }
  if (t < 0.7 + 3 * 0.55) { coin(c, W / 2, 150, 18, 1); T('× ' + (3 - Math.max(0, Math.min(3, Math.floor((t - 0.7) / 0.55) + (t > 0.7 ? 1 : 0)))), W / 2 + 42, 150, 18, '#FFD740'); }
  // 안내
  if (t < SH0) msg = '🪙 냠! 코인 먹는 중… (한 마리는 굶음)';
  else if (t < SH1) msg = '🔀 섞는 중…'; else if (t < SH1 + 1.3) msg = '👆 1번 사람, 늑대를 골라요!';
  else if (t < SH1 + 3.0) { msg = '🪙 코인! 1번 통과 ✅'; msgC = '#69F0AE'; } else { msg = '💀 빈 입! 2번 원샷!'; msgC = '#FF5A6E'; }
  T(msg, W / 2, 610, 18, msgC);
  // 손가락
  const P1 = SH1 + 1.3, P2 = SH1 + 3.0;
  for (const [tp, k] of [[P1, PICK1], [P2, PICK2]]) { const u = (tp - t) / 0.5; if (u >= 0 && u < 1) T('👆', out[k].x + 8, out[k].y + R * 1.6 + u * 40, 40, '#fff'); }
  // 사람 점
  for (let i = 0; i < N; i++) { const x = W / 2 + (i - (N - 1) / 2) * 34; c.beginPath(); c.arc(x, 74, 12, 0, 7); c.fillStyle = ['#FF5A6E', '#4FC3F7', '#FFD54F', '#69F0AE'][i]; c.globalAlpha = (t > SH1 && ((t < P2 && i === 0) || (t >= P2 && i === 1))) ? 1 : 0.4; c.fill(); c.globalAlpha = 1; T(String(i + 1), x, 75, 12, '#000'); }
};
window.LOOP = SH1 + 5.2;
let t0 = performance.now(); const loop = () => { frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
if (!location.search.includes('still')) loop();
</script></body></html>
