<!doctype html><html><head><meta charset="utf-8"><title>따라 하기 — 액세서리 늑대 시안</title>
<style>html,body{margin:0;background:#12121A;font-family:-apple-system,"Noto Sans KR",sans-serif}canvas{display:block;margin:0 auto}</style></head><body><canvas id="c"></canvas>
<script type="module">
import { wolfHead, accessory } from './wolves.js';
const cv = document.getElementById('c'), c = cv.getContext('2d'), W = 390, H = 780, dpr = +(new URLSearchParams(location.search).get('dpr') || 2);
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; c.scale(dpr, dpr);
const T = (s, x, y, size, col, w = 900) => { c.font = `${w} ${size}px -apple-system,"Noto Sans KR",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = col; c.fillText(s, x, y); };
const COL = [['#2ECC71', '#145A32'], ['#E74C3C', '#641E16'], ['#3498DB', '#154360'], ['#F1C40F', '#7D6608']];
function shape(k, x, y, r) { c.beginPath();
  if (k === 0) c.arc(x, y, r, 0, 7); else if (k === 1) { c.moveTo(x, y - r); c.lineTo(x + r * 0.95, y + r * 0.75); c.lineTo(x - r * 0.95, y + r * 0.75); c.closePath(); }
  else if (k === 2) c.rect(x - r * 0.82, y - r * 0.82, r * 1.64, r * 1.64);
  else { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r * 1.05; i ? c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : c.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); }
  c.fill(); }
const SEQ = [1, 3, 0, 2]; const STEP = 0.75;
window.frame = (t) => {
  t %= SEQ.length * STEP + 1.4;
  c.fillStyle = '#12121A'; c.fillRect(0, 0, W, H);
  T('←  따라 하기', 70, 26, 18, '#fff', 700);
  T('4단계', W / 2, 92, 30, '#fff');
  const S = W - 32, x0 = 16, y0 = 150, gap = 12, p = (S - gap) / 2;
  const k = Math.floor(t / STEP), lit = k < SEQ.length && t - k * STEP < STEP * 0.7 ? SEQ[k] : -1, lu = lit >= 0 ? (t - k * STEP) / (STEP * 0.7) : 0;
  for (let i = 0; i < 4; i++) {
    const x = x0 + (i % 2) * (p + gap), y = y0 + Math.floor(i / 2) * (p + gap), on = i === lit;
    c.save(); c.translate(x + p / 2, y + p / 2); const sc = on ? 1.04 : 1; c.scale(sc, sc);
    c.beginPath(); c.roundRect(-p / 2, -p / 2, p, p, p * 0.16); c.fillStyle = on ? COL[i][0] : COL[i][1]; c.fill();
    if (on) { c.beginPath(); c.roundRect(-p / 2, -p / 2, p, p, p * 0.16); c.fillStyle = 'rgba(255,255,255,.18)'; c.fill(); }
    c.fillStyle = on ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.35)'; shape(i, -p / 2 + 20, -p / 2 + 20, 9);
    // 늑대: 켜지면 폴짝 + 아우~
    const jump = on ? Math.sin(Math.min(1, lu) * Math.PI) * p * 0.08 : 0, open = on ? Math.sin(Math.min(1, lu) * Math.PI) : 0;
    c.globalAlpha = on ? 1 : 0.55; c.translate(0, p * 0.06 - jump);
    wolfHead(c, p * 0.36, open); accessory(c, i, p * 0.36, t);
    c.globalAlpha = 1;
    if (on) { T('♪', p * 0.32, -p * 0.3 - lu * 14, 22, 'rgba(255,255,255,.9)'); for (let q = 0; q < 5; q++) { const a = q * 1.26 + t * 2; c.beginPath(); c.arc(Math.cos(a) * p * 0.42, Math.sin(a) * p * 0.42, 3, 0, 7); c.fillStyle = 'rgba(255,255,255,.7)'; c.fill(); } }
    c.restore();
  }
  T(k < SEQ.length ? '👀 잘 봐요' : '👆 따라 눌러요!', W / 2, y0 + p * 2 + gap + 40, 22, '#fff');
};
let t0 = performance.now(); const loop = () => { frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
if (!location.search.includes('still')) loop();
</script></body></html>
