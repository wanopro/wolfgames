name: APK 빌드

on:
  push:
    paths-ignore: ['web/**', 'README.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK 만들기
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk WolfGames.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WolfGames-apk
          path: WolfGames.apk

      - name: 릴리스에 APK 올리기 (폰에서 바로 다운로드용)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 울프 게임즈 빌드 ${{ github.run_number }}
          files: WolfGames.apk
